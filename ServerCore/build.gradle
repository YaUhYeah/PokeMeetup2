plugins {
  id 'java'
  id 'com.github.johnrengelman.shadow' version '8.1.1'
}

java {
  sourceCompatibility = JavaVersion.VERSION_11
  targetCompatibility = JavaVersion.VERSION_11
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':core')
  implementation "com.google.code.gson:gson:2.10.1"
  implementation "com.h2database:h2:2.1.214"
  implementation 'ch.qos.logback:logback-classic:1.4.11'
  implementation group: 'org.lz4', name: 'lz4-java', version: '1.8.0'



  implementation "com.esotericsoftware:kryonet:2.22.0-RC1"
  implementation "com.esotericsoftware.kryo:kryo:2.24.0"
  implementation "at.favre.lib:bcrypt:0.10.2"
}

shadowJar {
  archiveFileName = 'server.jar'
  destinationDirectory = file("${buildDir}/libs")
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  from "${project(':core').projectDir}/assets"
  manifest {
    attributes(
      'Main-Class': 'org.discord.ServerLauncher',
      'Implementation-Title': 'Pokemon Meetup Server',
      'Implementation-Version': project.version
    )
  }

  // Use the configurations property to include runtime dependencies
  configurations = [project.configurations.runtimeClasspath]

  // Exclude unnecessary files
  exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'

  // GOOD: Exclude specific client-side asset types, but keep data files like .json
  exclude '**/*.png', '**/*.jpg', '**/*.jpeg', '**/*.mp3', '**/*.wav', '**/*.ogg', '**/*.ttf'

  // BAD: Avoid broad exclusions like this, as it removes essential biome data
  // exclude 'assets/**'
}


task checkCoreResources {
  doLast {
    println "--- Diagnostic: Checking :core project's resource directories ---"
    try {
      project(':core').sourceSets.main.resources.srcDirs.each { dir ->
        println "Gradle sees resource directory: ${dir.absolutePath}"
        if (new File(dir, "Data/biomes.json").exists()) {
          println "SUCCESS: Found 'Data/biomes.json' inside this directory."
        } else {
          println "FAILURE: Did NOT find 'Data/biomes.json' inside this directory."
        }
      }
    } catch (Exception e) {
      println "ERROR: Could not access :core project resources. Is the project named ':core' in settings.gradle?"
      e.printStackTrace()
    }
    println "--- End Diagnostic ---"
  }
}
